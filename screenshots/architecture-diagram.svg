<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" fill="#0b0f19" rx="12"/>
  <rect x="20" y="20" width="860" height="60" fill="#131b2e" stroke="#1e2c4a" rx="8"/>
  <text x="40" y="58" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="bold">RiceForge Pro — System Architecture</text>
  <text x="560" y="58" fill="#94a3b8" font-family="sans-serif" font-size="14">CCSDS 121.0-B-3 / ISO 15887</text>

  <!-- Left: Inputs -->
  <rect x="40" y="110" width="240" height="340" fill="#131b2e" stroke="#1e2c4a" rx="8"/>
  <text x="60" y="140" fill="#818cf8" font-family="sans-serif" font-size="16" font-weight="bold">1. Telemetry Samples</text>
  <rect x="60" y="160" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="75" y="190" fill="#f1f5f9" font-family="monospace" font-size="12">1D Science Sensor Data</text>
  <rect x="60" y="225" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="75" y="255" fill="#f1f5f9" font-family="monospace" font-size="12">Magnetometer / Plasma</text>
  <rect x="60" y="290" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="75" y="320" fill="#f1f5f9" font-family="monospace" font-size="12">4 to 32 bpp Resolution</text>
  <rect x="60" y="355" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="75" y="385" fill="#f1f5f9" font-family="monospace" font-size="12">Block Partitioning J=16</text>

  <!-- Middle: Engine -->
  <rect x="330" y="110" width="240" height="340" fill="#131b2e" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="350" y="140" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">2. Rice Coding Core</text>
  <rect x="350" y="160" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="365" y="190" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">Predictive Preprocessor</text>
  <rect x="350" y="225" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="365" y="255" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">Split-Sample Optimizer k*</text>
  <rect x="350" y="290" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="365" y="320" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">Zero-Block &amp; Uncompressed</text>
  <rect x="350" y="355" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="365" y="385" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">10-Point Normative Auditor</text>

  <!-- Right: Outputs -->
  <rect x="620" y="110" width="240" height="340" fill="#131b2e" stroke="#1e2c4a" rx="8"/>
  <text x="640" y="140" fill="#818cf8" font-family="sans-serif" font-size="16" font-weight="bold">3. Compressed Bitstream</text>
  <rect x="640" y="160" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="655" y="190" fill="#f1f5f9" font-family="monospace" font-size="12">CCSDS 121 Bitstream</text>
  <rect x="640" y="225" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="655" y="255" fill="#f1f5f9" font-family="monospace" font-size="12">Reference Sample s0</text>
  <rect x="640" y="290" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="655" y="320" fill="#f1f5f9" font-family="monospace" font-size="12">Option IDs + Code Bits</text>
  <rect x="640" y="355" width="200" height="50" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="655" y="385" fill="#34d399" font-family="monospace" font-size="12">Audit Scorecard (10/10)</text>
</svg>
